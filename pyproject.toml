[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extensible-python-calculator"
version = "0.1.0"
description = "Plugin-based calculator with a REPL and automatic CSV history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
calc = "calculator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
